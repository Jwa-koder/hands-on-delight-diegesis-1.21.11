plugins {
    id 'fabric-loom' version '1.17.19'
    id 'maven-publish'
}
version = '1.5.0-port.1'
group = 'com.pockyl.handson_delight'
base { archivesName = 'handson-delight-fabric-1.21.11' }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://maven.architectury.dev' }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    modImplementation 'maven.modrinth:farmers-delight-refabricated:1.21.11-3.6.16'
    compileOnly files(providers.gradleProperty('diegesisDevJar').getOrElse('../diegesis-1.21.11/build/devlibs/diegesis-fabric-1.21.11-1.0.0-beta.11-port.1-dev.jar'))
    compileOnly 'org.ow2.asm:asm-tree:9.7.1'
    compileOnly('dev.architectury:architectury-fabric:19.0.1') { transitive = false }
    compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
    // Optional station integration classes compile against the upstream 1.21.1 APIs;
    // their mixins only apply when those addons are installed.
    compileOnly 'maven.modrinth:brewin-and-chewin:MbcR48Ou'
    compileOnly 'maven.modrinth:choppers-delight:oulg9zE4'
    compileOnly 'maven.modrinth:cultural-delights:LYCtSz7r'
    compileOnly 'mezz.jei:jei-1.21.11-common-api:27.54.0.116'
    compileOnly 'mezz.jei:jei-1.21.11-fabric-api:27.54.0.116'
    modCompileOnly 'dev.emi:emi-fabric:1.1.24+1.21.1:api'
    modCompileOnly('me.shedaniel:RoughlyEnoughItems-api-fabric:21.11.816') { transitive = false }
}
sourceSets.main {
    java.srcDirs = ['common/src/main/java', 'fabric/src/main/java']
    java.exclude '**/gametest/**', '**/Fabric*Tests.java'
    resources.srcDirs = ['common/src/main/resources', 'fabric/src/main/resources']
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
def portVersion = project.version.toString()
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand minecraft_version: '1.21.11', fabric_loader_version: '0.19.5', fabric_api_version: '0.141.6', mod_id: 'handson_delight', mod_name: 'Hands-On Delight (Unofficial 1.21.11 Port)', mod_license: 'MIT', mod_version: portVersion, mod_authors: 'Pocky', mod_description: 'Unofficial port of Hands-On Delight to Fabric 1.21.11.', mod_url: 'https://github.com/Pocky-l/handson-delight', farmers_delight_version: '1.21.11-3.6.16', diegesis_version: '1.0.0-beta.11-port.1'
    }
}
jar { from('LICENSE') { rename { 'LICENSE_handson_delight' } } }
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '2000'] }

// Focused port-regression checks for recipe layouts and registry-aware item serialization.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly files(providers.gradleProperty('diegesisDevJar').getOrElse('../diegesis-1.21.11/build/devlibs/diegesis-fabric-1.21.11-1.0.0-beta.11-port.1-dev.jar'))
}
test { useJUnitPlatform() }
